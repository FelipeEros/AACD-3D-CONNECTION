<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagens - Instituição Parceira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../CSS/mensagens-parceira.css" />
      <link rel="stylesheet" href="../CSS/profile-menu.css" />
  </head>
  <body>
    <div class="partner-messages-app">
      <aside class="sidebar">
        <a class="brand" href="Tela_Dashboard_Parceira.html"><strong>AACD 3D<br />Connect</strong><small>Hub de Manufatura</small></a>
        <nav aria-label="Menu principal">
          <a class="nav-item" href="Tela_Dashboard_Parceira.html"><i class="bi bi-grid-1x2-fill" aria-hidden="true"></i>Dashboard</a>
          <a class="nav-item" href="Tela_Impressoras_Parceiras.html"><i class="bi bi-printer" aria-hidden="true"></i>Minhas Impressoras</a>
          <a class="nav-item" href="Tela_Materiais_Perceira.html"><i class="bi bi-box-seam" aria-hidden="true"></i>Meus Materiais</a>
          <a class="nav-item" href="Tela_Pedidos_Parceira.html"><i class="bi bi-clipboard-check" aria-hidden="true"></i>Pedidos</a>
          <a class="nav-item active" href="Tela_Mensagens_Parceira.html" aria-current="page"><i class="bi bi-chat-dots" aria-hidden="true"></i>Mensagens</a>
          <a class="nav-item" href="Tela_Configuracoes_Parceira.html"><i class="bi bi-gear" aria-hidden="true"></i>Configurações</a>
          
        </nav>
      </aside>

      <main class="messages-main">
        <header class="topbar"><div class="topbar-actions">
          <div class="notification-menu">
            <button type="button" class="notification-button" id="notificationButton" aria-label="Notificações" aria-expanded="false" aria-controls="notificationPanel">
              <i class="bi bi-bell" aria-hidden="true"></i><span class="notification-badge" hidden>0</span>
            </button>
            <section class="notification-panel" id="notificationPanel" aria-labelledby="notificationTitle">
              <header class="notification-header"><h2 id="notificationTitle">Notificações</h2><button type="button" id="markNotificationsRead">Marcar como lidas</button></header>
              <div class="notification-list"></div>
              <p class="notification-empty">Você está em dia!</p>
            </section>
          </div>
          <button type="button" class="user-avatar" aria-label="Perfil da instituição"><i class="bi bi-person" aria-hidden="true"></i></button>
        </div></header>
        <div class="messages-shell">
          <aside class="conversation-sidebar">
            <header class="panel-header"><h1>Mensagens</h1></header>
            <div class="conversation-list">
              <button class="conversation-item active" type="button" aria-current="true">
                <span class="conversation-icon"><i class="bi bi-building" aria-hidden="true"></i></span>
                <span class="conversation-copy"><strong>AACD Central</strong><small id="conversationPreview">Carregando mensagens...</small></span>
                <time id="conversationTime"></time>
              </button>
            </div>
          </aside>

          <section class="chat-panel" aria-label="Conversa com AACD Central">
            <header class="chat-header"><div class="contact"><span class="chat-avatar"><i class="bi bi-building" aria-hidden="true"></i></span><div><h2>AACD Central</h2><small>Equipe AACD 3D Connect</small></div></div><div class="chat-actions"><button id="conversationInfoButton" type="button" aria-label="Informações da conversa" aria-expanded="false"><i class="bi bi-info-circle" aria-hidden="true"></i></button><button id="conversationSearchButton" type="button" aria-label="Buscar na conversa" aria-expanded="false"><i class="bi bi-search" aria-hidden="true"></i></button></div></header>
            <div class="conversation-info" id="conversationInfo" hidden><strong>AACD Central</strong><span>Equipe AACD 3D Connect</span><small>Conversa institucional</small></div>
            <div class="conversation-search" id="conversationSearch" hidden><i class="bi bi-search" aria-hidden="true"></i><input id="conversationSearchInput" type="search" placeholder="Buscar nesta conversa" aria-label="Buscar nesta conversa" /></div>
            <div class="chat-body" id="messagesBody" aria-live="polite"><p>Carregando mensagens...</p></div>
            <p class="message-feedback" id="messageFeedback" role="status"></p>
            <form class="composer" id="messageForm">
              <input id="attachmentInput" type="file" hidden accept=".stl,.obj,.3mf,.pdf,.png,.jpg,.jpeg" />
              <button id="attachmentButton" class="composer-button" type="button" aria-label="Anexar arquivo"><i class="bi bi-paperclip" aria-hidden="true"></i></button>
              <input id="messageInput" type="text" placeholder="Escreva uma mensagem..." aria-label="Mensagem" autocomplete="off" />
              <button class="send-button" type="submit">Enviar <i class="bi bi-send" aria-hidden="true"></i></button>
            </form>
          </section>
        </div>
      </main>
    </div>
      <script src="../JS/config.js"></script>
    <script src="../JS/api.js" data-perfil="instituicao"></script>
      <script src="../JS/messages-parceira.js"></script>
      <script src="../JS/profile-menu.js"></script>
    <script src="../JS/notificacoes-parceira.js"></script>
  </body>
</html>
